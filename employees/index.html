<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1E3A3A">
    <meta name="description" content="سیستم جامع کارکنان آریو تجارت">

    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>سیستم جامع کارکنان | آریو تجارت</title>
</head>

<body>

    <div class="background-decoration background-decoration--one"></div>
    <div class="background-decoration background-decoration--two"></div>

    <main class="portal">

        <div class="brand">
            <span class="brand-en">ARIO TEJARAT</span>
        </div>

        <section class="welcome">

            <h1>
                سیستم جامع
                <strong>کارکنان</strong>
            </h1>

            <p>
                مدیریت، ارزیابی و ارتباط یکپارچه کارکنان آریو تجارت
            </p>

        </section>


        <section class="actions">

            <button class="action-card install-card" id="installApp">

                <div class="action-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tablet-smartphone preview-icon"><rect width="10" height="14" x="3" y="8" rx="2"/><path d="M5 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-2.4"/><path d="M8 18h.01"/></svg>
                </div>

                <div class="action-text">
                    <h2>ورود به سیستم</h2>
                    <p>مخصوص کارکنان آریو تجارت</p>
                </div>

                <span class="action-arrow">←</span>

            </button>


            <a href="jobs/" class="action-card recruitment-card">

                <div class="action-icon">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus preview-icon"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                </div>

                <div class="action-text">
                    <h2>درخواست استخدام</h2>
                    <p>مشاهده موقعیت‌های شغلی و تکمیل فرم استخدام</p>
                </div>

                <span class="action-arrow">←</span>

            </a>

        </section>


        <div class="portal-footer">
            <span>ARIO TEJARAT</span>
            <span>© تمامی حقوق محفوظ است</span>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
