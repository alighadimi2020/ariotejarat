<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1E3A3A">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>درخواست استخدام | آریو تجارت</title>
</head>

<body>

    <main class="jobs-page">

        <a href="../" class="back-button">
            →
            <span>بازگشت</span>
        </a>

        <header class="jobs-header">


            <h1>
                فرصت‌های همکاری
            </h1>

            <p>
                موقعیت شغلی موردنظر خود را انتخاب کنید
            </p>

        </header>


        <section class="jobs-list">

            <a href="warehouse/" class="job-card">



                <div class="job-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 9.5 12 4l9 5.5"/>
                        <path d="M5 10v9h14v-9"/>
                        <path d="M9 19v-5h6v5"/>
                    </svg>
                </div>

                <div class="job-content">
                    <h2>انباردار</h2>
                    <p>مدیریت، کنترل و ثبت کالا در انبار</p>
                </div>

                <span class="job-arrow">←</span>

            </a>


            <a href="sale" class="job-card disabled">



                <div class="job-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="8" r="3"/>
                        <path d="M5 21c.6-3.5 3.2-5.5 7-5.5s6.4 2 7 5.5"/>
                    </svg>
                </div>

                <div class="job-content">
                    <h2>کارشناس فروش</h2>
                </div>


            </a>


            <a href="#" class="job-card disabled">



                <div class="job-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="3" width="16" height="18" rx="2"/>
                        <path d="M8 8h8"/>
                        <path d="M8 12h8"/>
                        <path d="M8 16h5"/>
                    </svg>
                </div>

                <div class="job-content">
                    <h2>حسابدار</h2>
                    <p>فرم این موقعیت به‌زودی فعال می‌شود</p>
                </div>

                <span class="job-status">
                    به‌زودی
                </span>

            </a>

        </section>


        <footer>
            ARIO TEJARAT
        </footer>

    </main>

</body>
</html>
